name: Deploy to AWS (S3 + CloudFront)

# Mirrors how CTC's FreedomAG deploys a Vite SPA: build, sync to S3, invalidate
# CloudFront — authenticating with short-lived GitHub OIDC creds (no static AWS keys).

on:
  push:
    branches: [production]
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build
        env:
          # Public contact email baked into the static build (the mailto: target).
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
